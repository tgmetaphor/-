
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>лист metaphor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="top-bar">
    <div class="logo-area">
        <span class="logo-icon"><i class="fas fa-user-friends"></i></span>
        <span class="logo-text">metaphor</span>
    </div>
    <div class="search-wrapper">
        <input type="text" class="search-input" id="global-search" placeholder="search" autocomplete="off">
    </div>
    <div class="stats-badge" id="people-counter">
        <span id="count-number">0</span> участников
    </div>
</div>

<div class="container">
    <div class="people-grid" id="people-container"></div>
</div>

<div id="profile-modal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="modal-name">name</h2>
            <button class="close-modal" id="close-modal-btn">&times;</button>
        </div>
        <div class="modal-body" id="modal-body-content"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
